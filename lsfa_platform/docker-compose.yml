services:
  db:
    image: postgres:16-alpine
    container_name: lsfa_postgres
    environment:
      POSTGRES_DB: lsfa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lsfa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - lsfa_pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: lsfa_web
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: dev-secret-key-change-me
      DEBUG: "True"
      DB_NAME: lsfa_db
      DB_USER: postgres
      DB_PASSWORD: lsfa_dev_password
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db

volumes:
  lsfa_pgdata:
